services:

  - type: web
    name: flashcache-api
    runtime: python
    plan: free
    region: singapore

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:

      - key: DATABASE_URL
        fromDatabase:
          name: flashcache-db
          property: connectionString

      - key: FLASHCACHE_READ_TOKEN
        generateValue: true

      - key: FLASHCACHE_WRITE_TOKEN
        generateValue: true

      - key: FLASHCACHE_ADMIN_TOKEN
        generateValue: true

      - key: FLASHCACHE_HMAC_SECRET
        generateValue: true


databases:

  - name: flashcache-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"